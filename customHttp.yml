# Security headers, applied by Amplify Hosting to every response.
# Amplify reads this file from the build output root on each deploy.
#
# The analytics and advertising hosts in script-src, connect-src and img-src
# are for GA4 and Meta Pixel, loaded by scripts/consent.js only after consent.
# If the tools change, change these hosts, consent.js and the privacy page's
# cookie table together. script-src never gets 'unsafe-inline'.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          img-src 'self' data: https://www.google-analytics.com https://www.facebook.com;
          media-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          script-src 'self' https://www.googletagmanager.com https://connect.facebook.net;
          connect-src 'self' https://*.lambda-url.ap-south-1.on.aws https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com;
          form-action 'self';
          frame-ancestors 'none';
          base-uri 'self'
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/styles/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/scripts/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/data/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
